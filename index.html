<meta charset="utf-8">
<script>try{if(localStorage.getItem("cuc-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<title>Center Utility Complex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Control-room HMI: a deliberate single dark theme, painted explicitly. One screen, no page scroll. */
:root{
  --bg:#0a1411; --panel:#101d19; --panel-2:#152621; --line:#23382f; --line-2:#2f4a3f;
  --text:#dde9e3; --muted:#8ca59b; --faint:#5f786e;
  --se:#3dcd58; --se-deep:#009e4d; --aveva:#a974dc;
  --cat1:#3987e5; --cat2:#d95926; --cat3:#199e70; /* categorical slots 1-3, dark steps */
  --chw:#4fb6ec; --cw:#f08b4b; --ok:#3dcd58; --warn:#f2b43d; --crit:#ff5f5f; --off:#61756d;
  --glass:rgba(8,18,15,.82);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --box:#13231e; --box-2:#0c1814; --pop-bg:rgba(10,20,17,.96); --ref:#c9b27a; --flow:#e9f6ff;
  --chwr:#2c6f99; --cws:#c9a15a; --air:#6f8c80; --mkup:#7fb7c9; --prev-bg:#0c1714; --hover:#1c3029; --se-hover:#0bb35a;
  --bm-ex:#2f4b40; --bm-gd:#263e35; --bm-fr:#1f322b; --bm-pr:#192822;
  --s-pt:#b48ae0; --s-tt:#ff9b6a; --s-ft:#4fb6ec; --s-lt:#7fd6c2; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
/* Light theme: same token names, light steps. Picked with the sun/moon button in the header. */
:root[data-theme="light"]{
  --bg:#e9efec; --panel:#ffffff; --panel-2:#f1f5f3; --line:#dce5e0; --line-2:#c2d0c9;
  --text:#14221c; --muted:#4c6359; --faint:#788c83;
  --se:#00873f; --se-deep:#009e4d;
  --cat1:#2a6fc4; --cat2:#c4501f; --cat3:#138a61;
  --chw:#1f7fbf; --cw:#d0662a; --ok:#1e9e44; --warn:#b7791f; --crit:#d93636; --off:#8a9a93;
  --glass:rgba(255,255,255,.9);
  --box:#f3f7f5; --box-2:#e6edea; --pop-bg:rgba(255,255,255,.98); --ref:#9a7b2f; --flow:#ffffff;
  --chwr:#7fb0d4; --cws:#b38a2e; --air:#6f8c80; --mkup:#4f9bb3; --prev-bg:#d9e2de; --hover:#e3ece8; --se-hover:#00873f;
  --bm-ex:#c4ded0; --bm-gd:#d5e8de; --bm-fr:#e5efea; --bm-pr:#f0f5f2;
  --s-pt:#8a5cc2; --s-tt:#d0662a; --s-ft:#1f7fbf; --s-lt:#2a9c86; --shadow:rgba(20,40,30,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);margin:0;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--se);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:600 11px/1.1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr)}

/* Top bar with the brand lockup built in */
.top{display:flex;align-items:center;gap:10px 22px;height:58px;padding-inline:16px;border-bottom:1px solid var(--line);overflow:hidden}
.brands{display:flex;align-items:center;gap:16px;flex-shrink:0}
.brands .se{height:30px;width:auto;display:block}
.brands .av{height:15px;width:auto;display:block;margin-top:3px}
.brands .sep{width:1px;height:26px;background:var(--line-2)}
.title{display:grid;gap:1px;margin-right:auto;min-width:0;border-left:1px solid var(--line-2);padding-left:22px}
.title h1{font:600 25px/1 var(--display);letter-spacing:.01em;margin:0;white-space:nowrap}
.title h1 span{color:var(--se)}
.title p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:20px;align-items:center}
.meta div{display:grid;gap:4px}
.meta strong{font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--se);border:1px solid var(--se-deep);padding:6px 9px;border-radius:3px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--se);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(61,205,88,.6)}70%,100%{box-shadow:0 0 0 7px rgba(61,205,88,0)}}

/* Two full-screen views */
.views{position:relative;min-height:0}
.view{position:absolute;inset:0;transition:opacity .35s ease,transform .35s ease,visibility 0s linear 0s}
.view.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,transform .25s ease,visibility 0s linear .25s}
#mapView.off{transform:scale(1.04)}
#detail.off{transform:scale(.98)}

/* Map view: image fitted to the space left of the plant sidebar */
.mapview{display:grid;grid-template-columns:minmax(0,1fr) clamp(270px,calc(100vw - (100vh - 58px) * 1528 / 1029),440px)}
.mapwrap{container-type:size;position:relative;overflow:hidden;min-width:0;min-height:0;background:var(--bg)}
/* image covers the map area; pins stay in image coordinates */
.stage{--w:max(100cqw,calc(100cqh * 1528 / 1029));position:absolute;width:var(--w);height:calc(var(--w) * 1029 / 1528);left:calc((100cqw - var(--w)) / 2);top:calc((100cqh - var(--w) * 1029 / 1528) / 2)}
.map3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:high-quality}
/* road layer: kerb, white edge line, asphalt, dashed lane line */
.roads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.roads path{fill:none;stroke-linecap:butt;stroke-linejoin:round}
.rd-case{stroke:#1f1a10;opacity:.35}
.rd-fill.hwy{stroke:#f6cf57;opacity:.92}
.rd-fill.art{stroke:#fff6d8;opacity:.85}
.rd-fill.loc{stroke:#ffffff;opacity:.72}
.rd-name{font:600 10.5px Roboto,"Segoe UI",Arial,sans-serif;fill:#fff;stroke:#1b1b1b;stroke-width:3px;paint-order:stroke;stroke-linejoin:round;letter-spacing:.3px;dominant-baseline:central}

/* Plant equipment sidebar */
.side{display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--panel);border-left:1px solid var(--line);min-height:0;overflow:hidden}
.side-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.side-an{display:grid;gap:3px;min-width:0;padding:9px 12px;background:var(--se-deep);border:0;color:#fff;cursor:pointer;text-align:left}
.side-an b{font:600 15px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-an span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.side-an:hover{background:var(--se-hover)}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.side-h h2{margin:0;font:600 18px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.side-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line)}
.side-sum div{padding:6px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.side-sum div:nth-child(n+3){border-top:1px solid var(--line)}
.side-sum .label{font-size:9.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-sum div:nth-child(even){border-left:1px solid var(--line)}
.side-sum strong{font:600 20px/1 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.side-sum strong small{font:500 11px var(--sans);color:var(--muted);margin-left:3px}
.side-body{overflow-y:auto;overflow-x:hidden;padding:10px 12px 12px;display:grid;gap:10px;grid-template-rows:minmax(min-content,9fr) minmax(min-content,3.4fr) minmax(min-content,3.4fr) minmax(min-content,1.3fr)}
@media (min-height:960px){.eqlist,.eqgrid{gap:6px}}
.grp{display:grid;gap:6px;grid-template-rows:auto minmax(0,1fr)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;white-space:nowrap;min-width:0}
.grp-h .label{overflow:hidden;text-overflow:ellipsis}
.grp-h .label b{color:var(--text);font:600 12px var(--mono);letter-spacing:0}
.eqlist{display:grid;gap:4px;grid-auto-rows:minmax(26px,1fr)}
.eqrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel-2);border:1px solid transparent;border-left:3px solid var(--c);border-radius:2px;padding:6px 9px;cursor:pointer}
.eqrow:hover{border-color:var(--line-2);border-left-color:var(--c)}
.eqrow b{font:600 13px/1 var(--mono)}
.eqrow .m{font:12px/1.2 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;grid-auto-rows:minmax(34px,1fr)}
.eqgrid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.eqgrid .eqrow{grid-template-columns:1fr;gap:3px;padding:4px 7px;align-content:center}
.eqgrid .eqrow b{font-size:12px}
.st{font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--c);white-space:nowrap}

.hot{position:absolute;display:block;transform:translate(-50%,-50%);width:3.8%;height:0;padding:0 0 3.8%;border-radius:50%;border:0;background:transparent;cursor:pointer;z-index:2}
.hot::before{content:"";position:absolute;inset:6%;border-radius:50%;border:2px solid var(--st,var(--ok));box-shadow:0 0 10px color-mix(in srgb,var(--st,var(--ok)) 70%,transparent);transition:transform .15s,background .15s}
.hot::after{content:"";position:absolute;inset:6%;border-radius:50%;border:2px solid var(--st,var(--ok));animation:ring 2.4s infinite}
.hot:hover::before,.hot:focus-visible::before{transform:scale(1.4);background:color-mix(in srgb,var(--st,var(--ok)) 22%,transparent)}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.1);opacity:0}}
/* pins drawn by the dashboard for towers not labelled on the image — styled after the printed pins */
.hot.drawn{width:2.6%;padding-bottom:2.6%}
.cpin{position:absolute;left:50%;bottom:62%;transform:translateX(-50%);font:700 clamp(8px,1.1cqw,14px)/1 var(--sans);color:#fff;background:#0b5a34;border:2px solid #e9f5ee;border-radius:999px;padding:.35em .55em;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .15s}
.cpin::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:.42em solid transparent;border-top-color:#e9f5ee;border-bottom:0}
.cpin.major{font-size:clamp(9px,1.25cqw,15px);background:#064d2b}
.cpin.unverified{background:#f4efe4;color:#0b5a34;border:2px dashed #0b5a34}
.cpin.unverified::after{border-top-color:#0b5a34}
.cpin.cuc{bottom:100%;margin-bottom:6px;background:#064d2b}
.hot.zone:hover .cpin,.hot.drawn:hover .cpin,.hot.drawn:focus-visible .cpin{transform:translateX(-50%) scale(1.12)}
.hot.zone{transform:none;border-radius:6px;padding:0}
.hot.zone::before{inset:0;border-radius:6px;border-color:transparent;box-shadow:none}
.hot.zone::after{display:none}
.hot.zone:hover::before,.hot.zone:focus-visible::before{transform:none;border-color:var(--se);background:rgba(61,205,88,.14);box-shadow:0 0 26px rgba(61,205,88,.5)}

.ov{position:absolute;z-index:3;background:var(--glass);border:1px solid var(--line-2);border-radius:4px;backdrop-filter:blur(6px)}
.attrib{right:14px;top:12px;padding:4px 8px;font-size:11px;color:var(--muted)}.attrib a{color:var(--chw)}
.hint{left:14px;top:12px;padding:6px 10px;font-size:12px;color:var(--text);display:flex;align-items:center;gap:8px}
.hint b{color:var(--se);font-weight:600}
/* covers the Schneider mark printed on the source image; the lockup lives in the top bar */
.legendplate{left:calc((var(--w) - 100cqw) / 2);bottom:2%;width:max(180px,calc(var(--w) * .178 - (var(--w) - 100cqw) / 2));border-left:0;border-radius:0 4px 4px 0;min-height:10.5%;padding:8px 10px;display:grid;gap:6px;align-content:center}
.legendplate div{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px}
.legendplate span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legendplate i{width:8px;height:8px;border-radius:50%;border:2px solid var(--c)}
.kpibar{left:max(19%,240px);right:14px;bottom:14px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpibar .k{padding:8px 11px;display:grid;gap:4px;border-right:1px solid var(--line);min-width:0}
.kpibar .k:last-child{border-right:0}
.kpibar .v{font:600 21px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpibar .v small{font:500 11.5px var(--sans);color:var(--muted);margin-left:3px}
.kpibar .k.alarm .v{color:var(--warn)}
.kpibar .label{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@container (max-width:900px){.kpibar{grid-template-columns:repeat(3,minmax(0,1fr))}.kpibar .k:nth-child(n+4){display:none}.hint{font-size:11px}}
@container (max-width:620px){.legendplate,.kpibar{display:none}.hint{font-size:10.5px;padding:4px 7px}}

.pop{position:absolute;z-index:5;width:250px;background:var(--pop-bg);border:1px solid var(--line-2);border-radius:4px;box-shadow:0 12px 30px var(--shadow);padding:12px;pointer-events:none;display:grid;gap:9px}
.pop h3{margin:0;font:600 19px/1 var(--display);letter-spacing:.02em}
.pop .sub{color:var(--muted);font-size:11.5px}
.pop dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:0}
.pop dt{font:600 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pop dd{margin:3px 0 0;font:500 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.pop .go{font-size:11.5px;color:var(--se)}

.pill{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:2px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

/* KPI view */
.detail{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);background:var(--panel);overflow:hidden}
.dhead{min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;border-bottom:1px solid var(--line)}
.dname{display:grid;gap:3px;min-width:0}
.dname h2{font:600 28px/1 var(--display);margin:0;letter-spacing:.01em;white-space:nowrap}
.chips{display:flex;gap:5px;margin-left:auto;overflow-x:auto;max-width:100%;padding-block:2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line-2);border-radius:3px;padding:5px 8px;cursor:pointer;font:500 12px/1 var(--mono);white-space:nowrap;color:var(--muted)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--off)}
.chip:hover{border-color:var(--muted);color:var(--text)}
.chip.on{background:var(--se-deep);border-color:var(--se-deep);color:#fff}
.dk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kpi{padding:9px 14px;display:grid;gap:5px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi .v{font:600 25px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font:500 12.5px var(--sans);color:var(--muted);margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:26px}
.kpi svg{width:100%;height:26px;display:block}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,360px);min-height:0}
.schem{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;border-right:1px solid var(--line);padding:10px 12px;min-width:0;min-height:0}
.schem-fit{min-height:0;min-width:0}
.schem-fit svg{display:block;width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;background:var(--c)}

.eq{cursor:pointer}
.eq .box{fill:var(--box);stroke:var(--line-2);stroke-width:1.5}
.eq:hover .box,.eq:focus .box{stroke:var(--text)}
.eq.sel .box{stroke:var(--se);stroke-width:2.5}
.eq:focus{outline:none}
.eq text{fill:var(--text);font-family:var(--mono);font-size:12px}
.eq text.t{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em}
.eq text.s{fill:var(--muted);font-size:11px}
.eq text.lbl{font-size:10px;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.pipe{fill:none;stroke-width:5;stroke-linecap:round}
.flow{fill:none;stroke-width:2;stroke-dasharray:6 14;stroke:var(--flow);opacity:.55}

/* Analytics */
.an{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);background:var(--panel);overflow:hidden}
.an-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;margin-left:auto;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;border-left:1px solid var(--line-2);padding:7px 11px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--se-deep);color:#fff}
.an-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line)}
.an-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);min-height:0}
.an-card{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.an-card+.an-card{border-left:1px solid var(--line)}
.an-card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 16px 8px;flex-wrap:wrap}
.an-card-h h3{margin:0;font:600 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.rank{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding:0 16px 12px;min-height:0}
.split-h{margin-bottom:6px}
.split{display:flex;gap:2px;height:22px}
.split i{display:flex;align-items:center;padding-left:8px;min-width:0;overflow:hidden}
.split i:first-child{border-radius:4px 0 0 4px}.split i:last-child{border-radius:0 4px 4px 0}
.split i span{font:600 11px var(--mono);color:#fff}
.split-l{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--muted)}
.split-l span{display:inline-flex;align-items:center;gap:6px}
.split-l i{width:10px;height:10px;border-radius:2px}
.split-l b{color:var(--text);font-weight:500}
.rk-axis,.rk-row{display:grid;grid-template-columns:64px minmax(0,1fr) 52px;gap:8px;align-items:center}
.rk-ticks{position:relative;height:14px}
.rk-ticks em{position:absolute;top:0;transform:translateX(-50%);font:normal 10.5px var(--mono);color:var(--faint)}
.rk-ticks em:first-child{transform:none}.rk-ticks em:last-child{transform:translateX(-100%)}
.rk-unit{font:10.5px var(--mono);color:var(--faint);text-align:right}
.rk-rows{display:grid;grid-auto-rows:minmax(17px,1fr);gap:1px;min-height:0;overflow-y:auto}
.rk-row{cursor:pointer;border-radius:2px}
.rk-row:hover,.rk-row:focus-visible{background:var(--panel-2)}
.rk-name{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.rk-row:hover .rk-name{color:var(--text)}

.mt-key span{display:inline-flex;align-items:center;gap:5px}
.mt-key i,.mt-bar i{display:block;height:6px;border-radius:1px}
.mt-key i{width:12px}
i.done{background:var(--ok)}i.over{background:var(--crit)}i.wip{background:var(--warn)}i.plan{background:var(--off)}
.mt-calwrap{padding:0 16px}
.mt-wk,.mt-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mt-wk span{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 4px 3px}
.mt-day{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 6px;gap:4px;align-content:space-between;height:clamp(34px,5.4vh,52px);padding:4px 5px;background:var(--panel-2);border:1px solid transparent;border-radius:2px;cursor:pointer;text-align:left}
.mt-day:hover{border-color:var(--line-2)}
.mt-day.fri{opacity:.6}
.mt-day.today{border-color:var(--se)}
.mt-day.sel{background:var(--hover);border-color:var(--se-deep);box-shadow:inset 0 0 0 1px var(--se-deep)}
.mt-dn{font:600 13px/1 var(--mono)}.mt-dc{font-size:11px;color:var(--muted);line-height:1}
.mt-bar{grid-column:1/-1;display:flex;gap:1px;overflow:hidden;border-radius:1px}
.mt-dayh{padding:10px 16px 4px}.mt-dayh h4{margin:0;font:600 15px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;display:flex;gap:10px;align-items:baseline}
.mt-daylist{padding:0 16px 12px}
.mt-tbl td{white-space:normal;vertical-align:middle}.mt-tbl tbody tr{cursor:default}.mt-tbl small{color:var(--muted);font-size:11px}
.mt-tbl .btn{padding:4px 9px;font-size:12px}
.mt-s{display:inline-block;padding:2px 7px;border-radius:2px;font:600 10.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;border:1px solid currentColor;white-space:nowrap}
.mt-s.done{color:var(--ok)}.mt-s.over{color:var(--crit)}.mt-s.wip{color:var(--warn)}.mt-s.due{color:var(--se)}.mt-s.plan{color:var(--muted)}
#toasts{position:fixed;top:66px;left:50%;translate:-50% 0;z-index:80;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;background:var(--pop-bg);border:1px solid var(--line-2);border-left:4px solid var(--ok);border-radius:4px;box-shadow:0 10px 26px var(--shadow);font-size:12.5px;animation:tin .25s ease}
.toast>i{font-style:normal;color:var(--ok);font-weight:700;font-size:16px;line-height:1.1}
.toast div{display:grid;gap:2px;min-width:0}.toast div>b{font:600 15px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ok)}
.toast small{color:var(--muted);font-size:11.5px}
.toast .toast-a{display:flex;gap:4px;align-items:center}.toast .btn{padding:4px 9px;font-size:12px}
.toast-x{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:2px 4px}.toast-x:hover{color:var(--text)}
.toast.out{opacity:0;transform:translateX(12px);transition:.25s ease}
@keyframes tin{from{opacity:0;transform:translateX(12px)}}
@media (max-width:1180px){#maint .an-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}#maint .seg{margin-left:0}}
@media (max-width:900px){#maint{display:block;overflow-y:auto}.mt-body{grid-template-columns:1fr}.mt-right{border-left:0!important;border-top:1px solid var(--line)}.mt-list{overflow:visible}.mt-row{grid-template-columns:1fr auto}.mt-t{grid-column:1/-1;grid-row:2}.mt-x{flex-wrap:wrap}}
/* theme switch (sun / moon icon) */
.theme-btn{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;background:transparent;border:1px solid var(--line-2);border-radius:3px;color:var(--muted);cursor:pointer}
.theme-btn:hover{color:var(--text);border-color:var(--muted)}
.theme-btn svg{width:18px;height:18px;display:block}
.theme-btn .sun{display:none}
:root[data-theme="light"] .theme-btn .sun{display:block}
:root[data-theme="light"] .theme-btn .moon{display:none}
:root[data-theme="light"] .rp-page{box-shadow:0 4px 18px var(--shadow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* light / dark theme: saved per browser, dark by default */
(function(){
  const root=document.documentElement, btn=document.getElementById('themeBtn');
  const set=t=>{ if(t==='light') root.dataset.theme='light'; else delete root.dataset.theme;
    btn.setAttribute('aria-label',t==='light'?'Switch to dark mode':'Switch to light mode'); };
  let saved=null; try{ saved=localStorage.getItem('cuc-theme'); }catch(e){}
  set(saved==='light'?'light':'dark');
  btn.addEventListener('click',()=>{ const t=root.dataset.theme==='light'?'dark':'light'; set(t); try{ localStorage.setItem('cuc-theme',t); }catch(e){} });
})();
</script>
